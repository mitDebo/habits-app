server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name habits.kdubs.tech;

    ssl_certificate     /etc/letsencrypt/live/habits.kdubs.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/habits.kdubs.tech/privkey.pem;
    include snippets/ssl-common.conf;

    location /api/ {
        proxy_pass http://127.0.0.1:8110;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8111;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name habits.kdubs.tech;

    include snippets/http-redirect.conf;
}
